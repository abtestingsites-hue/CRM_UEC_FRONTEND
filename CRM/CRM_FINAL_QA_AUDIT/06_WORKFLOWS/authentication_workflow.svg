  <text x="50" y="90" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#94a3b8">Login → JWT Issue → RBAC Role Guard → Session Tracking → Logout Blacklist • ElderCare Enterprise CRM Architecture</text>
  <line x1="50" y1="110" x2="1050" y2="110" stroke="#334155" stroke-width="1" />

